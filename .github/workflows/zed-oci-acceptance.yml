name: zed-oci exact-digest acceptance

on:
  pull_request:
    paths:
      - .github/workflows/zed-oci-acceptance.yml
      - config/zed-oci.env
      - docs/zed-oci.md
      - fixtures/zed-oci-*.Dockerfile
      - scripts/*zed-oci*.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/zed-oci-acceptance.yml
      - config/zed-oci.env
      - docs/zed-oci.md
      - fixtures/zed-oci-*.Dockerfile
      - scripts/*zed-oci*.sh
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:
    inputs:
      image_ref:
        description: Exact ghcr.io/zed-pkg/zed-oci@sha256 digest; blank uses the scheduled pin
        required: false
        type: string
      expected_version:
        description: Expected three-part Zed version; blank uses the scheduled pin
        required: false
        type: string
      certificate_identity:
        description: Exact canonical publisher identity; blank uses the scheduled pin
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zed-oci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      expected_version: ${{ steps.resolve.outputs.expected_version }}
      certificate_identity: ${{ steps.resolve.outputs.certificate_identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Validate generated fleet contract
        run: node scripts/validate-plan.mjs
      - name: Resolve exact acceptance target
        id: resolve
        env:
          INPUT_IMAGE_REF: ${{ inputs.image_ref }}
          INPUT_EXPECTED_VERSION: ${{ inputs.expected_version }}
          INPUT_CERTIFICATE_IDENTITY: ${{ inputs.certificate_identity }}
        shell: bash
        run: |
          set -euo pipefail
          source config/zed-oci.env
          image_ref="${INPUT_IMAGE_REF:-$ZED_OCI_IMAGE_REF}"
          expected_version="${INPUT_EXPECTED_VERSION:-$ZED_OCI_EXPECTED_VERSION}"
          certificate_identity="${INPUT_CERTIFICATE_IDENTITY:-$ZED_OCI_CERTIFICATE_IDENTITY}"
          ./scripts/validate-zed-oci-target.sh \
            "$image_ref" "$expected_version" "$certificate_identity"
          {
            printf 'image_ref=%s\n' "$image_ref"
            printf 'expected_version=%s\n' "$expected_version"
            printf 'certificate_identity=%s\n' "$certificate_identity"
          } >> "$GITHUB_OUTPUT"
      - name: Validate acceptance scripts
        run: |
          bash -n scripts/*zed-oci*.sh
          shellcheck scripts/*zed-oci*.sh

  signed-index:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Verify signature, platforms, SBOMs, and provenance
        run: |
          ./scripts/verify-zed-oci-index.sh \
            "${{ needs.target.outputs.image_ref }}" \
            "${{ needs.target.outputs.expected_version }}" \
            "${{ needs.target.outputs.certificate_identity }}"

  docker:
    needs:
      - target
      - signed-index
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
          - platform: linux/arm64
            architecture: arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Verify exact builder and clean runtime
        run: |
          ./scripts/verify-zed-oci-docker.sh \
            "${{ needs.target.outputs.image_ref }}" \
            "${{ needs.target.outputs.expected_version }}" \
            "${{ needs.target.outputs.certificate_identity }}" \
            "${{ matrix.platform }}"
      - name: Reject fixable high and critical builder vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          image-ref: zed-oci-acceptance-builder-${{ matrix.architecture }}:verify
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          timeout: 10m

  podman:
    needs:
      - target
      - signed-index
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Install distribution Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Verify rootless Podman builder-to-runtime path
        run: |
          ./scripts/verify-zed-oci-podman.sh \
            "${{ needs.target.outputs.image_ref }}" \
            "${{ needs.target.outputs.expected_version }}" \
            "${{ needs.target.outputs.certificate_identity }}"
